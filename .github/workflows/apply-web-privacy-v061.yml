name: Apply FormaFlow Hosted Privacy Hardening

on:
  push:
    branches: [privacy-mobile-v061]
    paths:
      - "scripts/apply_web_privacy_v061.py"
      - ".github/workflows/apply-web-privacy-v061.yml"

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply hosted privacy migration
        run: python scripts/apply_web_privacy_v061.py

      - name: Compile backend
        run: python -m py_compile app.py

      - name: Validate frontend syntax
        run: node --check static/app.js

      - name: Run backend test suite
        run: pytest -q

      - name: Commit tested hardening
        run: |
          rm -f scripts/apply_web_privacy_v061.py .github/workflows/apply-web-privacy-v061.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clarify hosted privacy and harden API responses"
          git push
