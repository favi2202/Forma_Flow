name: Apply FormaFlow v0.6.1 Privacy Migration

on:
  push:
    branches: [privacy-mobile-v061]
    paths:
      - "scripts/apply_privacy_v061.py"
      - ".github/workflows/apply-privacy-v061.yml"

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply privacy migration
        run: python scripts/apply_privacy_v061.py

      - name: Compile backend
        run: python -m py_compile app.py

      - name: Run test suite
        run: pytest -q

      - name: Commit tested migration
        run: |
          rm -f scripts/apply_privacy_v061.py .github/workflows/apply-privacy-v061.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden temporary sessions for v0.6.1"
          git push
